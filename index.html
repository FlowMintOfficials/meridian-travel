<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Meridian ships no server, so this meta tag is the only CSP some
      hosts (GitHub Pages, plain static file servers) will ever apply —
      see public/_headers for the header-delivered version used by hosts
      that support it (Netlify, Cloudflare Pages). That version also sets
      frame-ancestors and X-Frame-Options for clickjacking protection —
      both are silently ignored (frame-ancestors: logged as a console
      error on every load; X-Frame-Options: not a meta-taggable header at
      all) when set this way, so there's no point duplicating them here.
      script-src has no 'unsafe-inline': there are no inline <script>
      tags or inline event-handler attributes anywhere in the app, so
      this blocks injected <script> execution outright if an XSS is ever
      found elsewhere. style-src still allows 'unsafe-inline' because
      React sets plenty of legitimate dynamic inline styles (progress
      bars, cover gradients) — CSS injection alone can't execute script.
      connect-src allows the `stun:` scheme (bare scheme-source, not a
      specific host — CSP's host-matching syntax doesn't apply to
      non-hierarchical schemes like this) for the device sync feature's
      public STUN server (lib/peerSync.ts) — connect-src governs
      RTCPeerConnection's ICE server URLs too, not just fetch/XHR/
      WebSocket. worker-src covers Vite's own dev-mode error overlay (a
      blob: worker) in `npm run dev`; harmless to keep in the shipped
      build too since nothing here currently uses a real worker.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' blob: data:;
        connect-src 'self' https://api.frankfurter.dev https://api.open-meteo.com https://geocoding-api.open-meteo.com stun:;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        manifest-src 'self'"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!--
      iOS Safari's "Add to Home Screen" ignores the manifest's icons array
      entirely (and SVG favicons) — it only ever looks for this specific
      link tag, and only accepts a raster image. Without it, an installed
      icon on an iPhone/iPad home screen silently falls back to a screenshot
      of whatever the page looked like at install time instead of the
      Meridian mark. 180x180 is Apple's current largest-needed size; iOS
      downsamples for the Spotlight/Settings-sized slots itself.
    -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Meridian — a private, offline-first travel companion for packing lists, itineraries, and multi-currency expense tracking." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Meridian · Travel companion</title>
    <script type="module" crossorigin src="./assets/index-D6ZeA6nI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BJ_1GQJj.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
